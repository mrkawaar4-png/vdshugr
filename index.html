<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 40px;
            text-align: center;
        }
        h1 {
            color: #5C6AC4;
        }
        p {
            font-size: 1.2em;
        }
        .highlight {
            color: #ff6347;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>This is a <span class="highlight">clean</span> and simple webpage example.</p>
</body>
</html>
